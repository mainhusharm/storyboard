<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Storyboard Studio</title>
<style>
  :root {
    --bg:#08090c;--bg2:#0d0f14;--panel:#11141b;--panel2:#161a23;--panel3:#1c2130;
    --line:#222836;--line2:#2e3650;
    --txt:#eef1f6;--dim:#8a94a8;--faint:#556074;
    --amber:#f0a32e;--amber2:#ffc45e;--teal:#2dd4bf;--red:#f87171;--violet:#8b7cf6;--pink:#f472b6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.55 Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;
    background-image:radial-gradient(900px 400px at 85% -10%,rgba(240,163,46,.07),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(45,212,191,.06),transparent 60%);
    display:flex;align-items:center;justify-content:center;padding:24px}
  a{color:var(--teal);text-decoration:none}
  a:hover{text-decoration:underline}

  .card{width:min(420px,100%);background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);border-radius:16px;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo .s{width:34px;height:34px;border-radius:9px;flex:none;background:linear-gradient(135deg,var(--amber),#c97b12);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#100c04;box-shadow:0 0 18px rgba(240,163,46,.35)}
  .logo h1{font-size:17px;letter-spacing:2px;font-weight:700}
  .logo h1 b{color:var(--amber)}
  .tagline{color:var(--faint);font-size:12px;margin-bottom:24px}
  .tagline b{color:var(--dim)}

  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:18px}
  .tabs button{border:none;background:transparent;color:var(--dim);font:600 12.5px Inter;padding:9px;border-radius:8px;cursor:pointer;transition:.15s}
  .tabs button.active{background:linear-gradient(135deg,var(--amber),#d98a17);color:#160f02}
  .tabs button:not(.active):hover{color:var(--txt)}

  label.f{display:block;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin:14px 0 5px}
  input{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font:13px Inter;transition:border-color .15s,box-shadow .15s}
  input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 2px rgba(240,163,46,.12)}
  input::placeholder{color:var(--faint)}

  button.cta{width:100%;margin-top:20px;padding:12px;background:linear-gradient(135deg,var(--amber),#d98a17);border:none;border-radius:9px;color:#160f02;font:700 13px Inter;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 18px rgba(240,163,46,.22);transition:transform .12s,box-shadow .15s}
  button.cta:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(240,163,46,.32)}
  button.cta:disabled{opacity:.4;cursor:not-allowed}

  #err{display:none;margin-top:14px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:var(--red);font-size:12px;padding:9px 12px;border-radius:8px}
  #err.show{display:block}
  .fine{margin-top:18px;text-align:center;color:var(--faint);font-size:12px}
  .fine a{color:var(--amber2)}
  .back{margin-top:12px;text-align:center;font-size:12px}
  .hint{margin-top:8px;font-size:11px;color:var(--faint);text-align:center}
  .pwrow{position:relative}
  .pwrow .toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--faint);cursor:pointer;font-size:11px;letter-spacing:.5px}
  .pwrow .toggle:hover{color:var(--txt)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{display:none;width:14px;height:14px;border:2px solid rgba(22,15,2,.35);border-top-color:#160f02;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
  .spinner.show{display:inline-block}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="s">S</div><h1>STORYBOARD <b>STUDIO</b></h1></div>
  <div class="tagline">Sign in to access <b>Storyboard</b>, <b>Trends</b>, <b>AI Influencer</b> &amp; <b>Flashloop Studio</b>.</div>

  <div class="tabs">
    <button id="tabLogin" class="active" onclick="setMode('login')">Log in</button>
    <button id="tabSignup" onclick="setMode('signup')">Create account</button>
  </div>

  <div id="signupFields" style="display:none">
    <label class="f">Your name</label>
    <input id="name" type="text" placeholder="e.g. Maya Sharma" autocomplete="name">
  </div>

  <label class="f">Email</label>
  <input id="email" type="email" placeholder="you@example.com" autocomplete="email">

  <label class="f">Password</label>
  <div class="pwrow">
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="toggle" id="togglePw" onclick="togglePw()">SHOW</button>
  </div>

  <button class="cta" id="submit" onclick="submit()"><span class="spinner" id="spinner"></span><span id="submitLabel">Log in</span></button>
  <div id="err"></div>
  <div class="fine" id="fine">New here? <a href="#" onclick="setMode('signup');return false">Create a free account</a></div>
  <div class="hint">Accounts are stored in a secure database. Passwords are hashed, never stored in plain text.</div>
  <div class="back"><a href="/">← Back to home</a></div>
</div>

<script>
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const rawNext=params.get('next')||'/';
// Only allow same-site paths (blocks protocol-relative open redirects like //evil.com)
const next=(rawNext.startsWith('/')&&!rawNext.startsWith('//'))?rawNext:'/';
let mode='login';

function setMode(m){
  mode=m;
  $('tabLogin').classList.toggle('active',m==='login');
  $('tabSignup').classList.toggle('active',m==='signup');
  $('signupFields').style.display=m==='signup'?'block':'none';
  $('submitLabel').textContent=m==='login'?'Log in':'Create account';
  $('fine').innerHTML=m==='login'
    ? 'New here? <a href="#" onclick="setMode(\'signup\');return false">Create a free account</a>'
    : 'Already have an account? <a href="#" onclick="setMode(\'login\');return false">Log in</a>';
  $('err').classList.remove('show');
  $('password').autocomplete=m==='login'?'current-password':'new-password';
}
function togglePw(){const p=$('password');p.type=p.type==='password'?'text':'password';$('togglePw').textContent=p.type==='password'?'SHOW':'HIDE';}
function fail(msg){$('err').textContent=msg;$('err').classList.add('show');}

async function submit(){
  const email=$('email').value.trim();
  const password=$('password').value;
  if(!email||!password){fail('Please fill in your email and password.');return;}
  if(mode==='signup'){
    const name=$('name').value.trim();
    if(name.length<2){fail('Please enter your name.');return;}
    if(password.length<6){fail('Password must be at least 6 characters.');return;}
  }
  $('spinner').classList.add('show');
  $('submit').disabled=true;
  $('err').classList.remove('show');
  try{
    const body=mode==='signup'
      ? JSON.stringify({name:$('name').value.trim(),email,password})
      : JSON.stringify({email,password});
    const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){location.href=next.startsWith('/')?next:'/';return;}
    fail(j.error||'Something went wrong. Please try again.');
  }catch(e){fail('Network error — please try again.');}
  $('spinner').classList.remove('show');
  $('submit').disabled=false;
}

// If already logged in, skip straight to the app
(async()=>{
  try{
    const r=await fetch('/api/auth/me',{cache:'no-store'});
    if(r.ok){location.replace(next.startsWith('/')?next:'/');}
  }catch(e){}
})();

$('email').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
</script>
</body>
</html>
